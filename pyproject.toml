[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cabi-analysis"
version = "0.1.0"
description = "SQL and pandas analysis of Capital Bikeshare trips: demand patterns, station pressure and data quality"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Chizaram Ugonna-Ufere"}]
dependencies = ["pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cabi = "cabi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cabi = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
